apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mattermost-ha-role
  namespace: mattermost-test
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mattermost-ha-rolebinding
  namespace: mattermost-test
subjects:
- kind: ServiceAccount
  name: mattermost-ha
  namespace: mattermost-test
roleRef:
  kind: Role
  name: mattermost-ha-role
  apiGroup: rbac.authorization.k8s.io
