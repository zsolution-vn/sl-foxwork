replicaCount: 3

image:
  repository: vcr.vngcloud.vn/109605-salely/zs-foxwork-server-sevice
  pullPolicy: IfNotPresent
  tag: "prod2d2cf5d0"

imagePullSecrets: []

imagePullSecrets:
   - name: vcr-secret
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: false  # Use service account from mattermost-ha chart
  annotations: {}
  name: ""  # Will use mattermost-ha service account name

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 8065
  targetPort: 8065

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/client-max-body-size: "200m"
    nginx.ingress.kubernetes.io/proxy-body-size: "200m"

    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
  hosts:
    - host: work.foxia.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - work.foxia.vn
      secretName: work-tls-secret

resources:
  limits:
    cpu: 2000m
    memory: 2Gi
  requests:
    cpu: 1000m
    memory: 1Gi

autoscaling:
  enabled: false
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Mattermost Configuration
mattermost:
  config:
    SqlSettings:
      DriverName: postgres
      DataSource: "postgres://mattermostuser:jdrli0iuX46N2RV51v4@49.213.89.28:25432/mattermostdb?sslmode=disable&connect_timeout=10"
      MaxIdleConns: 20
      MaxOpenConns: 300
      ConnMaxLifetimeMilliseconds: 3600000
    ClusterSettings:
      Enable: true
      ClusterName: mattermost-k8s
      BindAddress: "0.0.0.0"
      GossipPort: 7946
      AdvertiseAddress: ""
      LeaderElectionMode: "k8s"
      # LeaderElectionK8sNamespace and LeaderElectionK8sLeaseName will be auto-populated from mattermost-ha subchart
      # If mattermost-ha is disabled, these defaults will be used:
      LeaderElectionK8sNamespace: ""  # Will use Release.Namespace if empty
      LeaderElectionK8sLeaseName: ""  # Will use {release-name}-ha if empty
    extraEnv:
      - name: MM_CONFIG
        value: "/mattermost/config/config.json"

      # Database
      - name: MM_SQLSETTINGS_DRIVERNAME
        value: "postgres"
      - name: MM_SQLSETTINGS_DATASOURCE
        value: "postgres://mattermostuser:jdrli0iuX46N2RV51v4@49.213.89.28:25432/mattermostdb?sslmode=disable&connect_timeout=10"

      # Cluster / HA
      - name: MM_CLUSTERSETTINGS_ENABLE
        value: "true"
      - name: MM_CLUSTERSETTINGS_CLUSTERNAME
        value: "mattermost-k8s"
      - name: MM_CLUSTERSETTINGS_BINDADDRESS
        value: "0.0.0.0"
      - name: MM_CLUSTERSETTINGS_GOSSIPPORT
        value: "7946"
      - name: MM_CLUSTERSETTINGS_LEADERELECTIONMODE
        value: "k8s"
      - name: MM_CLUSTERSETTINGS_LEADERELECTIONK8SNAMESPACE
        value: "{{ .Release.Namespace }}"
      - name: MM_CLUSTERSETTINGS_LEADERELECTIONK8SLEASENAME
        value: "mattermost-ha"

      # HA settings
      - name: MM_HIGHAVAILABILITYSETTINGS_ENABLE
        value: "true"
      - name: MM_HIGHAVAILABILITYSETTINGS_READONLYCONFIG
        value: "false"

      # Service settings
      - name: MM_SERVICESETTINGS_LISTENADDRESS
        value: ":8065"
      - name: MM_SERVICESETTINGS_SITEURL
        value: "https://work.foxia.vn"

      # Log settings
      - name: MM_LOGSETTINGS_ENABLECONSOLE
        value: "true"
      - name: MM_LOGSETTINGS_CONSOLELEVEL
        value: "INFO"
      - name: MM_LOGSETTINGS_CONSOLEJSON
        value: "false"
    ServiceSettings:
      ListenAddress: ":8065"
      SiteURL: "https://work.foxia.vn"
    LogSettings:
      EnableConsole: true
      ConsoleLevel: INFO
      ConsoleJson: false
    HighAvailabilitySettings:
      Enable: true
      ReadOnlyConfig: false
    FileSettings:
      DriverName: local
      Directory: "/mattermost/data"
      MaxFileSize: 52428800
    PluginSettings:
      Enable: true
      EnableUploads: true

# Database Configuration
postgresql:
  enabled: false
  image:
    repository: postgres
    tag: "18"
  auth:
    postgresPassword: "mostest"
    database: "mattermost"
    username: "mmuser"
    password: "mostest"
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

# Storage Configuration
persistence:
  enabled: true
  storageClass: "vngcloud-nvme-5000-delete"
  size: 1Gi
  accessModes:
    - ReadWriteOnce

# HA Add-on Configuration
mattermost-ha:
  enabled: true
  skipHeadlessService: true  # Main chart creates its own headless service
  serviceAccount:
    create: true
    name: ""  # Will default to {release-name}-ha
  cluster:
    enabled: true
    lease:
      namespace: ""  # Will use Release.Namespace if empty
      name: mattermost-ha
      leaseDurationSeconds: 15
      renewDeadlineSeconds: 10
      retryPeriodSeconds: 2
    gossip:
      port: 7946
      advertiseAddress: ""
      bindAddress: "0.0.0.0"

