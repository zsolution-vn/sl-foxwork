apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ default (printf "%s-ha" .Release.Name) .Values.serviceAccount.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-lease
  namespace: {{ .Values.cluster.lease.namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-lease
  namespace: {{ .Values.cluster.lease.namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ default (printf "%s-ha" .Release.Name) .Values.serviceAccount.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-lease



