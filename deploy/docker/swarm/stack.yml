version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: mattermost
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mostest
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - ha
    deploy:
      placement:
        constraints:
          - node.role == manager

  mm-ha-app:
    image: mattermost-ha:latest
    env_file:
      - swarm.env
    environment:
      # Fallbacks if env file is missing
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mmuser:mostest@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_CONFIG: postgres://mmuser:mostest@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_CLUSTERSETTINGS_ENABLE: "true"
      MM_CLUSTERSETTINGS_CLUSTERNAME: mm-ha
      MM_CLUSTERSETTINGS_BINDADDRESS: 0.0.0.0
      MM_CLUSTERSETTINGS_GOSSIPPORT: "7946"
      MM_CLUSTERSETTINGS_LEADERELECTIONMODE: db
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      SWARM_SERVICE_NAME: mm-ha-app
    configs:
      - source: mm-entrypoint
        target: /mattermost/bin/entrypoint-swarm.sh
        mode: 0555
    entrypoint: ["/mattermost/bin/entrypoint-swarm.sh"]
    volumes:
      - app-data:/mattermost/data
    networks:
      - ha
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        order: start-first
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.platform.os == linux

  nginx-lb:
    image: nginx:1.27-alpine
    configs:
      - source: mm-nginx-conf
        target: /etc/nginx/conf.d/default.conf
        mode: 0444
    ports:
      - target: 8065
        published: 8065
        protocol: tcp
        mode: ingress
    networks:
      - ha
    deploy:
      replicas: 2
      placement:
        constraints:
          - node.platform.os == linux

networks:
  ha:
    external: false
    driver: overlay

volumes:
  db-data:
  app-data:

configs:
  mm-entrypoint:
    file: ./entrypoint-swarm.sh

  mm-nginx-conf:
    file: ./nginx.conf


